# 顧客プランの定義。顧客へのプラン割り当ては data/entities.yaml の clients[].plan。
# 価格はプランごとの固定料金（請求は案件ごとに按分しない）。
# runs.cost_allocation の按分は社内の原価把握用で、請求には使わない。
# 頻度・試行回数・質問セットが原価に直結する。1問×1試行×4エンジン（解析込み）≒ 35円が目安。

calendar:
  # 日付・曜日はすべて日本時間で判定する
  weekly_day: mon # weekly の実行日
  twice_weekly_days: [mon, thu] # twice_weekly の実行日
  biweekly_day: mon # biweekly は ISO 週番号が偶数の週のこの曜日
  monthly_day: 1 # monthly の実行日（日付）

plans:
  # Lite: 単発計測（お試し）。定期実行には含めず、受注時に手動で1回実行する
  #   npm run measure -- --scope full --clients <顧客ID>
  # 【要検討】試行回数・質問数・正解データの範囲・正解データの入力者
  lite:
    label: Lite（単発）
    frequency: once
    priority_frequency: none
    trials: 3
    engines: [openai, gemini, perplexity, claude]
    max_competitors: 3
    question_set: tagged # 質問辞書で plans に lite を含む質問のみ
    paraphrases: false
    fact_keys: # 【要検討】正解データとして扱う項目（業界別）
      idol: [current_members, former_members, agency, latest_release]
      music: [signature_songs, label, latest_release]
      game: [publisher, platforms, service_status]
    monthly_cost_cap_jpy: 3000 # 1社あたりの API 原価の上限（暴走防止）
    report: summary # エンジン合計の傾向＋誤情報一覧
    human_support: false

  # Basic: 月額サブスクリプション
  basic:
    label: Basic（月額）
    frequency: weekly
    priority_frequency: twice_weekly
    trials: 5
    engines: [openai, gemini, perplexity, claude]
    max_competitors: 3
    question_set: all
    paraphrases: true
    fact_keys: all
    monthly_cost_cap_jpy: 40000
    report: full # エンジン別・カテゴリ別・推移・信頼区間
    human_support: false

  # Pro: 月額サブスクリプション＋人によるサポート
  # 【要検討】計測内容を Basic と変えるか（競合数・重要質問の頻度など）。現状は Basic と同じ計測
  pro:
    label: Pro（月額・サポート付き）
    frequency: weekly
    priority_frequency: twice_weekly
    trials: 5
    engines: [openai, gemini, perplexity, claude]
    max_competitors: 3
    question_set: all
    paraphrases: true
    fact_keys: all
    monthly_cost_cap_jpy: 40000
    report: full
    human_support: true
